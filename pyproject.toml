[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-agent2"
version = "0.1.0"
description = "A testable and explainable Python RAG application."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [
    { name = "yaunshiren" },
]
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "markdown-it-py>=4.2,<5",
    "openai>=1.109,<2",
    "pgvector>=0.5,<1",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<7",
    "sentence-transformers>=5.7,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "torch>=2.13,<2.14",
    "transformers>=5.15,<6",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
customer-agent2 = "customer_agent2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
asyncio_mode = "auto"
markers = [
    "database_integration: requires the local PostgreSQL and migrated pgvector schema",
    "model_smoke: requires local model weights and runs real CPU inference",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
